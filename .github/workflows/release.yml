name: Publish image

# Publishes a multi-architecture image to the GitHub Container Registry so it can
# be pulled with `docker pull ghcr.io/<owner>/sub_scribe`.
#
# main is published as :latest for anyone tracking the tip. Pushing a version tag
# (v1.2.3) additionally publishes :1.2.3, :1.2, and :1 so a deployment can pin to
# whatever level of churn it is willing to accept.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 matters here: a lot of self-hosted media servers are Raspberry Pis
      # and other ARM boxes, and QEMU is what lets one runner build for both.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=sub_scribe
            org.opencontainers.image.description=Self-hosted YouTube archiver that syncs to Plex and Jellyfin

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers between runs so a code-only change does not reinstall
          # yt-dlp, ffmpeg, and the Python toolchain every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
