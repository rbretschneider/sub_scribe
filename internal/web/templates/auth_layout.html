<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}sub_scribe{{end}} · sub_scribe</title>
  <script>try{var t=localStorage.getItem("theme");if(t){document.documentElement.setAttribute("data-theme",t);}}catch(e){}</script>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
  <!-- Deliberately chrome-free: no sidebar, nav, or token badge. This layout
       is what a browser sees before it has signed in, so it must never leak
       application state and must render with nothing but static assets. -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="brand auth-brand">
        <svg class="brand-dot" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7z" fill="#f2a63b" stroke="#d9871c" stroke-width="1"/></svg>
        <span class="brand-name">sub<b>_</b>scribe</span>
      </div>
      {{block "content" .}}{{end}}
    </div>
  </main>
</body>
</html>
